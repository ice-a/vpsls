# Cloudflare Pages 配置
# 构建命令：pnpm exec nuxi build --preset cloudflare_pages -> 产物目录 dist/
#
# 重要：本项目部署目标是 Pages，不是 Workers。
# Pages 项目的配置文件只接受下列字段；写入 Workers 专属字段会直接导致构建失败：
#   crons / triggers、observability、durable_objects、queues、r2_buckets 等
# 每日定时任务不在这里配置，见 .github/workflows/daily.yml（定时调用 /api/cron 接口）
#
# KV 绑定在 Cloudflare Dashboard 配置：
#   Pages 项目 -> Settings -> Functions -> KV namespace bindings -> 变量名 DATA
name = "vpsls"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"