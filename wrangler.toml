# Cloudflare Pages 项目配置
# 构建命令：pnpm exec nuxi build --preset cloudflare_pages -> 产物目录 dist/
#
# 注意：本项目部署目标是 Pages，不是 Workers。
# 这份配置文件只允许出现 Pages 支持的字段。写入 Workers 专属字段
# （定时调度、可观测性、持久对象、消息队列、对象存储桶等）会直接让构建失败。
# 每日定时任务不在这里配置，见 .github/workflows/daily.yml —— 它定时调用 /api/cron 接口。
#
# KV 绑定请在 Cloudflare Dashboard 配置：
#   Pages 项目 -> Settings -> Functions -> KV namespace bindings -> 变量名 DATA
name = "vpsls"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"