name: daily
on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京 04:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily job (check + refetch + rates)
        run: |
          curl -fsS -X POST "${{ secrets.SITE_URL }}/api/cron?key=${{ secrets.CRON_SECRET }}"